<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drop | Plastic-free shampoo and conditioner bars</title>
  <meta name="description" content="Clean hair. Cleaner planet. No bottle required. Drop makes high-performance, plastic-free shampoo and conditioner bars. Join the waitlist.">
  <meta name="theme-color" content="#f6f1e7">
  <meta property="og:title" content="Drop | Clean hair. Cleaner planet. No bottle required.">
  <meta property="og:description" content="High-performance shampoo and conditioner bars for people who want great hair without plastic waste.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dropecobar.com/">
  <link rel="canonical" href="https://dropecobar.com/">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
  <link rel="preload" href="fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <main class="pause">
    <a class="brand" href="/" aria-label="Drop">
      <svg class="brand__mark" viewBox="0 0 24 32" aria-hidden="true"><path d="M12 1.5C12 1.5 2 13.2 2 20.2a10 10 0 0 0 20 0C22 13.2 12 1.5 12 1.5Z"/></svg>
      <span class="brand__word">drop</span>
    </a>
    <p class="eyebrow">Shampoo &amp; conditioner bars</p>
    <h1 class="pause__title"><span>Clean hair.</span> <span>Cleaner planet.</span> <span>No bottle required.</span></h1>
    <p class="pause__lede">We're giving our site a refresh. Check back soon, or join the waitlist and we'll email you when Drop launches.</p>
    <form class="signup signup--center" data-form="waitlist" novalidate>
      <label class="signup__label sr-only" for="pause-email">Your email</label>
      <div class="signup__row">
        <input class="field" id="pause-email" name="email" type="email" autocomplete="email" placeholder="you@email.com" required>
        <button class="btn" type="submit">Join the waitlist</button>
      </div>
      <p class="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="main.js?v=6" defer></script>
